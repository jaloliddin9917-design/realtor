services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: realtor
      POSTGRES_PASSWORD: realtor
      POSTGRES_DB: realtor
    ports:
      - "5432:5432"
    volumes:
      - realtor_pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realtor -d realtor"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  realtor_pgdata:
