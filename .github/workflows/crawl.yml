name: Crawl OLX

# OLX blocks Render's datacenter IP, so the crawl can't run on the API host. This runs it on
# GitHub's runners (a different IP) straight into the Neon database on a schedule. The app just
# reads the data; nothing crawls on Render. `run-source` crawls the source directly even though
# it's marked disabled (the disabled flag only stops the on-Render worker from touching it).
on:
  schedule:
    # Once a day (06:17 UTC ≈ 11:17 Tashkent). The crawl routes through a residential proxy
    # (OLX blocks GitHub's IP), and free proxy tiers are small (~a handful of full crawls/month),
    # so daily keeps us inside the free quota. Bump this once we've measured real credit usage.
    - cron: "17 6 * * *"
  workflow_dispatch: {}       # lets you run it by hand from the Actions tab (for testing)

concurrency:
  group: crawl-olx
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    # OLX throttles GitHub's datacenter IP, so the crawl runs ~10x slower here than on an
    # unthrottled IP and needs well over 25 min. The whole crawl commits in ONE transaction at
    # the very end (see pipeline.py "Transaction contract"), so a mid-run timeout SIGKILLs the
    # process and rolls back everything — zero data saved. Give it real headroom to finish
    # (minutes are free on a public repo; runs are 3h apart so a long one never overlaps the next).
    timeout-minutes: 90
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: pip install .
      - name: Crawl olx-rent into Neon
        env:
          # add this in the repo: Settings → Secrets and variables → Actions → New repository secret.
          # Value = the Neon connection string (the app normalizes it to asyncpg automatically).
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"   # flush logs live so the step shows progress, not a silent block
          # Don't download ~1.8k photo files (throttled on GitHub's IP, and this deploy hotlinks
          # the OLX CDN so they'd be discarded anyway) — store the CDN URL only. Cuts the crawl
          # from 90+ min (timed out) to minutes. Trade-off: no phash photo-dedup on new listings.
          # It also keeps the proxy request count to ~180/run (index+detail) instead of ~2k.
          CRAWL_DOWNLOAD_PHOTOS: "false"
          # OLX blocks GitHub's datacenter IP outright (2026-09-09: every run hangs on the first
          # request → 90-min timeout → zero data). Route OLX requests through a residential proxy
          # so they exit from a normal IP OLX serves. Add a repo secret OLX_PROXY_URL = the
          # proxy-mode URL of a residential/scraper-proxy provider (e.g. ScraperAPI/ZenRows free
          # tier). Empty/unset is ignored (env_ignore_empty) → no proxy, same as before.
          OLX_PROXY_URL: ${{ secrets.OLX_PROXY_URL }}
        run: python -m app.cli run-source olx-rent
